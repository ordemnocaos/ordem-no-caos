<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#7A5A16">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Verificação do Google Search Console: cole aqui a tag
     <meta name="google-site-verification" content="..."> que o Google
     vai te dar ao verificar a propriedade pelo método "Tag HTML". -->

<!-- Open Graph / Twitter Card — preview ao compartilhar o link -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/logo.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
<meta name="twitter:image" content="{{ '/assets/img/logo.png' | absolute_url }}">

<link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicons/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- Analytics privado (GoatCounter) — só você vê o painel.
     Troque "SEU-CODIGO" pelo código que você escolher ao criar
     a conta grátis em https://www.goatcounter.com -->
<script data-goatcounter="https://ordemnocaos.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- aplica o tema salvo (ou 'light' por padrão) antes da página pintar, pra evitar flash -->
<script>
  (function(){
    var saved = localStorage.getItem('onc-theme');
    var theme = saved || '{{ site.theme_default | default: "light" }}';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
