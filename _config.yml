title: Ordem no Caos
description: >-
  Recomendações de livros, journaling, setup de leitura e decoração
  filosófica para atravessar o caos moderno.

# Site publicado como projeto dentro da conta ordemnocaos:
# https://ordemnocaos.github.io/ordem-no-caos/
baseurl: "/ordem-no-caos"
url: "https://ordemnocaos.github.io"

collections:
  promocoes:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# tema com o qual o site abre antes de o visitante trocar manualmente
theme_default: light

plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
