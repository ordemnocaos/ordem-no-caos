title: Ordem no Caos
description: >-
  Recomendações de livros, journaling, setup de leitura e decoração
  filosófica para atravessar o caos moderno.

# Se este site for publicado como usuario.github.io (conta dedicada,
# raiz do domínio), deixe baseurl vazio.
# Se em algum momento virar um projeto dentro de outra conta
# (usuario.github.io/ordem-no-caos), troque para: baseurl: "/ordem-no-caos"
baseurl: ""
url: ""

collections:
  promocoes:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# tema com o qual o site abre antes de o visitante trocar manualmente
theme_default: light

plugins:
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
