backend:
  name: github
  # troque pelo repositório real, formato "usuario/nome-do-repo"
  repo: ordemnocaos/ordem-no-caos
  branch: main

media_folder: "assets/img/promocoes"
public_folder: "/assets/img/promocoes"

collections:
  - name: "promocoes"
    label: "Promoções"
    label_singular: "Promoção"
    folder: "_promocoes"
    create: true
    slug: "{{slug}}"
    identifier_field: nome
    summary: "{{nome}} — {{categoria}}"
    sortable_fields: ["date", "nome", "categoria", "prioridade"]
    fields:
      - { label: "Nome do produto", name: "nome", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - "Livros"
          - "Journaling"
          - "Setup de Leitura"
          - "Decoração Filosófica"
      - { label: "Preço original", name: "preco_original", widget: "number", value_type: "float", required: false, hint: "deixe em branco se não houver desconto" }
      - { label: "Preço com desconto", name: "preco_desconto", widget: "number", value_type: "float" }
      - { label: "Destaque (Em Alta)", name: "destaque", widget: "boolean", required: false, default: false, hint: "Marque manualmente quando o produto estiver vendendo bem de verdade (não só recebendo clique)" }
      - { label: "Prioridade no destaque", name: "prioridade", widget: "number", value_type: "int", required: false, hint: "Só importa se 'Destaque' estiver marcado. Números menores aparecem primeiro (1 = topo de tudo). Deixe em branco se não quiser controlar a ordem entre os destaques." }
      - { label: "Link de afiliado", name: "link_afiliado", widget: "string" }
      - { label: "Imagem do produto", name: "imagem", widget: "image" }
      - { label: "Data", name: "date", widget: "datetime" }

  - name: "textos"
    label: "Textos do site"
    files:
      - name: "geral"
        label: "Textos gerais"
        file: "_data/site_texts.yml"
        fields:
          - { label: "Frase do topo (tagline)", name: "hero_tagline", widget: "string" }
          - { label: "Aviso de afiliado", name: "disclosure", widget: "text" }
          - { label: "Nota do rodapé", name: "footer_note", widget: "string" }
          - { label: "Link do canal no YouTube", name: "youtube_url", widget: "string" }
